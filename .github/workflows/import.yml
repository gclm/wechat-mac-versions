name: Import History

on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'Import scope'
        type: choice
        options:
          - all
          - v4
          - limit
        default: v4
      limit:
        description: 'Number of latest releases to import (when scope=limit)'
        type: number
        default: 3
      dry_run:
        description: 'Dry run: download and extract only, no publish'
        type: boolean
        default: false

jobs:
  import:
    runs-on: macos-latest
    timeout-minutes: 300
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Import history from zsbai/wechat-versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.scope }}" = "all" ]; then
            ARGS="--all"
          elif [ "${{ github.event.inputs.scope }}" = "v4" ]; then
            ARGS="--v4-only"
          else
            ARGS="--limit ${{ github.event.inputs.limit }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python3 scripts/import_history.py $ARGS
